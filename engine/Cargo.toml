[package]
name = "spotify-playback-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[[bin]]
name = "SpotifyPlaybackEngine"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cpal = "0.16"
futures-util = { version = "0.3", default-features = false }
http = "1"
protobuf = "3.7"
protobuf-json-mapping = "3.7"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
librespot-audio = { version = "=0.8.0", default-features = false }
librespot-core = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["native-tls"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["native-tls", "rodio-backend"] }
librespot-protocol = { version = "=0.8.0", default-features = false }
rodio = { version = "0.21", default-features = false, features = ["playback"] }
# The OAuth authorize URL must be known before the flow runs (the UI presents
# it), so the engine drives the authorization-code + PKCE flow directly
# instead of going through librespot-oauth (which hides the URL inside
# get_access_token). Feature flags mirror librespot-oauth's so the shared
# reqwest/oauth2 dependency graphs stay unified.
oauth2 = { version = "5.0", default-features = false, features = ["reqwest", "reqwest-blocking"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "flac"] }
url = "2.5"
bytes = "1"
