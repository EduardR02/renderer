[package]
name = "renderer"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "renderer_lib"
# Desktop-only: `main.rs` links this as a plain Rust library. The scaffold's
# `staticlib`/`cdylib` outputs exist for mobile and FFI consumers, and cost a
# 142 MB static archive plus its link time on every build for nothing here.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy"] }
sha1 = "0.10"
souvlaki = "0.8"
renderer-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.44", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }
