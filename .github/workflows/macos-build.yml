name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test and build frontend
        run: |
          bun test
          bun run build
      - name: Build engine resource
        run: bun run build:engine
      - name: Test engine and shell
        run: |
          cargo test -p renderer-engine
          cargo test -p renderer
      - name: Build macOS app
        run: bun tauri build
      - name: Verify and sign app
        run: |
          app=target/release/bundle/macos/renderer.app
          test -d "$app"
          test -x "$app/Contents/Resources/PlaybackEngine"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = com.renderer.client
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 14.0
          codesign --force --sign - "$app/Contents/Resources/PlaybackEngine"
          codesign --force --sign - "$app"
          codesign --verify --deep --strict "$app"
      - name: Smoke-launch the app and bundled engine
        shell: bash
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/renderer.app
          log="$HOME/Library/Application Support/SpotifyRenderer/logs/renderer.log"
          "$app/Contents/MacOS/renderer" > runner-app.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if test -f "$log" && grep -q 'engine spawned (pid' "$log"; then
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat runner-app.log
              test ! -f "$log" || cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat runner-app.log
          test ! -f "$log" || cat "$log"
          exit 1
      - name: Archive app
        run: |
          ditto -c -k --sequesterRsrc --keepParent target/release/bundle/macos/renderer.app renderer-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-macos-adhoc-${{ runner.arch }}
          path: renderer-macos.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: renderer-macos-adhoc-ARM64
      - name: Attach macOS app to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" renderer-macos.zip --repo "$GITHUB_REPOSITORY"
